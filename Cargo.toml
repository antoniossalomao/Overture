[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/storage",
    "crates/import",
    "crates/render",
    "crates/media",
    "crates/output",
    "crates/control",
    "crates/i18n",
    "crates/ui",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Antonio Salomão <antonio.assuino.salomao@gmail.com>"]
repository = "https://github.com/antoniossalomao/Overture"

[workspace.dependencies]
overture-core = { path = "crates/core" }
overture-storage = { path = "crates/storage" }
overture-import = { path = "crates/import" }
overture-render = { path = "crates/render" }
overture-media = { path = "crates/media" }
overture-output = { path = "crates/output" }
overture-control = { path = "crates/control" }
overture-i18n = { path = "crates/i18n" }
overture-ui = { path = "crates/ui" }

anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
encoding_rs = "0.8"
quick-xml = { version = "0.37", features = ["serialize"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "ico"] }
cosmic-text = "0.12"
wgpu = "23.0"
pollster = "0.4"
bytemuck = { version = "1.20", features = ["derive"] }
winit = "0.30"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
] }
libloading = "0.8"
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
slint = "1.9"
slint-build = "1.9"
winresource = "0.1"
directories = "6.0"
tempfile = "3.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = "0.26"

# Optimize pixel composition & glyph rasterization in dev/test profiles for real-time 60fps output
[profile.dev.package.overture-render]
opt-level = 2
[profile.dev.package.cosmic-text]
opt-level = 2
[profile.dev.package.swash]
opt-level = 2
[profile.dev.package.image]
opt-level = 2

