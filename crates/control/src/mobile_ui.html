<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Overture — Controle Remoto</title>
  <style>
    :root {
      --bg: #090d16;
      --panel: #111827;
      --card: #1e293b;
      --accent: #38bdf8;
      --amber: #fbbf24;
      --danger: #ef4444;
      --success: #22c55e;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; max-width: 640px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: 0.03em; }
    .badge { font-size: 0.78rem; padding: 4px 10px; border-radius: 999px; background: var(--card); color: var(--muted); }
    .badge.ok { background: rgba(34,197,94,0.18); color: var(--success); }
    .panel { background: var(--panel); border: 1px solid #1f2937; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    .row { display: flex; gap: 8px; }
    input { flex: 1; background: var(--card); border: 1px solid #334155; color: var(--text); border-radius: 8px; padding: 10px 12px; font-size: 0.95rem; }
    button { border: none; border-radius: 10px; padding: 12px 14px; font-size: 0.95rem; font-weight: 600; cursor: pointer; background: var(--card); color: var(--text); active: opacity(0.85); }
    button.primary { background: var(--accent); color: #031525; }
    button.big { flex: 1; padding: 20px 12px; font-size: 1.12rem; }
    button.warn { background: #334155; color: var(--amber); }
    button.danger { background: rgba(239,68,68,0.2); color: #fca5a5; border: 1px solid rgba(239,68,68,0.4); }
    .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 6px; }
    .slide-box { min-height: 76px; background: var(--card); border-radius: 8px; padding: 12px; white-space: pre-line; font-size: 1.05rem; line-height: 1.4; }
    .slide-box.next { min-height: 56px; font-size: 0.92rem; color: var(--amber); background: rgba(30,41,59,0.65); }
    .slides-list { display: grid; grid-template-columns: 1fr; gap: 6px; max-height: 240px; overflow-y: auto; margin-top: 8px; }
    .slide-btn { text-align: left; white-space: pre-line; font-weight: 500; font-size: 0.9rem; padding: 10px; border: 1px solid transparent; }
    .slide-btn.active { border-color: var(--accent); background: rgba(56,189,248,0.16); }
  </style>
</head>
<body>
  <header>
    <h1>OVERTURE REMOTE</h1>
    <span id="status" class="badge">Desconectado</span>
  </header>

  <div class="panel">
    <div class="label">Token da Rede Local</div>
    <div class="row">
      <input id="token" type="password" placeholder="Token configurado no Overture" />
      <button class="primary" onclick="connectRemote()">Conectar</button>
    </div>
  </div>

  <div class="panel">
    <div class="label" id="itemTitle">Ao Vivo</div>
    <div class="slide-box" id="curSlide">—</div>
    <div class="label" style="margin-top:10px;">Próximo Slide</div>
    <div class="slide-box next" id="nextSlide">—</div>

    <div class="row" style="margin-top:12px;">
      <button class="big" onclick="sendCmd({command:'prev_slide'})">◀ Anterior</button>
      <button class="big primary" onclick="sendCmd({command:'next_slide'})">Próximo ▶</button>
    </div>
    <div class="row" style="margin-top:8px;">
      <button style="flex:1" class="warn" onclick="sendCmd({command:'toggle_black_screen'})">Tela Preta</button>
      <button style="flex:1" class="warn" onclick="sendCmd({command:'toggle_logo'})">Logo</button>
      <button style="flex:1" class="danger" onclick="sendCmd({command:'clear_presentation'})">Limpar</button>
    </div>
  </div>

  <div class="panel">
    <div class="label">Slides do Item Atual</div>
    <div class="slides-list" id="slidesList"></div>
  </div>

  <div class="panel">
    <div class="label">Placar Manual & Alerta de Palco</div>
    <div class="row" style="margin-bottom:8px;">
      <button style="flex:1" onclick="sendCmd({command:'increment_score',team_a_delta:1,team_b_delta:0})">+1 Equipe A</button>
      <button style="flex:1" onclick="sendCmd({command:'increment_score',team_a_delta:0,team_b_delta:1})">+1 Equipe B</button>
    </div>
    <div class="row">
      <input id="alertInput" type="text" placeholder="Mensagem de alerta para palco..." />
      <button onclick="sendAlert()">Alerta</button>
    </div>
  </div>

  <script>
    let ws = null;
    const saved = localStorage.getItem('overture_token');
    if (saved) document.getElementById('token').value = saved;

    function getToken() {
      const t = document.getElementById('token').value.trim();
      localStorage.setItem('overture_token', t);
      return t;
    }

    async function sendCmd(body) {
      const res = await fetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Overture-Token': getToken() },
        body: JSON.stringify(body)
      });
      if (res.ok) renderState(await res.json());
    }

    function sendAlert() {
      const msg = document.getElementById('alertInput').value;
      sendCmd({ command: 'set_stage_alert', message: msg || null });
    }

    function renderState(st) {
      const item = st.current_item;
      document.getElementById('itemTitle').textContent = item
        ? `${item.title} (${st.current_slide_index + 1}/${item.slides.length}) [${st.display_mode}]`
        : `Sem item ativo [${st.display_mode}]`;
      const cur = item && item.slides[st.current_slide_index] ? item.slides[st.current_slide_index].text : '—';
      const nxt = item && item.slides[st.current_slide_index + 1] ? item.slides[st.current_slide_index + 1].text : '[Fim]';
      document.getElementById('curSlide').textContent = cur;
      document.getElementById('nextSlide').textContent = nxt;

      const list = document.getElementById('slidesList');
      list.innerHTML = '';
      if (item) {
        item.slides.forEach((s, idx) => {
          const b = document.createElement('button');
          b.className = 'slide-btn' + (idx === st.current_slide_index ? ' active' : '');
          b.textContent = `${idx + 1}. ${s.text}`;
          b.onclick = () => sendCmd({ command: 'goto_slide', index: idx });
          list.appendChild(b);
        });
      }
    }

    async function connectRemote() {
      const token = getToken();
      if (ws) { ws.close(); ws = null; }
      const r = await fetch('/api/state', { headers: { 'X-Overture-Token': token } });
      const badge = document.getElementById('status');
      if (!r.ok) {
        badge.textContent = 'Token Inválido';
        badge.className = 'badge';
        return;
      }
      renderState(await r.json());
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${location.host}/api/ws?token=${encodeURIComponent(token)}`);
      ws.onopen = () => { badge.textContent = 'Conectado (Tempo Real)'; badge.className = 'badge ok'; };
      ws.onclose = () => { badge.textContent = 'Desconectado'; badge.className = 'badge'; };
      ws.onmessage = (ev) => {
        try {
          const parsed = JSON.parse(ev.data);
          if (parsed.event === 'output_updated' && parsed.state) renderState(parsed.state);
        } catch (_) {}
      };
    }

    if (saved) connectRemote();
  </script>
</body>
</html>
